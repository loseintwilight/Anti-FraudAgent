<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI反诈骗大师 - 全流程闭环演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-card: #232a3b;
            --text-primary: #e7e9ea;
            --text-secondary: #8b98a5;
            --accent-blue: #1d9bf0;
            --accent-green: #00ba7c;
            --accent-yellow: #ffad1f;
            --accent-red: #f4212e;
            --border-color: #38444d;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #1d9bf0, #00ba7c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        
        .flow-steps {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .flow-step {
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }
        
        .flow-step.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }
        
        .flow-step.completed {
            background: var(--accent-green);
            color: white;
            border-color: var(--accent-green);
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 1000px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        
        .card-header {
            padding: 16px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }
        
        .card-header .step-badge {
            background: var(--accent-blue);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .input-section textarea {
            width: 100%;
            min-height: 120px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: vertical;
            margin-bottom: 15px;
        }
        
        .input-section textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        .sample-texts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .sample-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .sample-btn:hover {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }
        
        .analyze-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), #0077cc);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(29, 155, 240, 0.3);
        }
        
        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 结果展示 */
        .result-section {
            display: none;
        }
        
        .result-section.visible {
            display: block;
        }
        
        .result-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-blue);
        }
        
        .result-item h4 {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }
        
        .result-item .content {
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        /* 检索结果 */
        .search-result {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        
        .search-result .similarity {
            display: inline-block;
            background: var(--accent-green);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-bottom: 8px;
        }
        
        .search-result .case-id {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 5px;
        }
        
        .search-result .case-type {
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .search-result .case-desc {
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        
        /* 风险等级 */
        .risk-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            margin: 10px 0;
        }
        
        .risk-low {
            background: rgba(0, 186, 124, 0.2);
            color: var(--accent-green);
            border: 2px solid var(--accent-green);
        }
        
        .risk-medium {
            background: rgba(255, 173, 31, 0.2);
            color: var(--accent-yellow);
            border: 2px solid var(--accent-yellow);
        }
        
        .risk-high {
            background: rgba(244, 33, 46, 0.2);
            color: var(--accent-red);
            border: 2px solid var(--accent-red);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 33, 46, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(244, 33, 46, 0); }
        }
        
        /* 预警弹窗 */
        .alert-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }
        
        .alert-modal.visible {
            display: flex;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .alert-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.4s;
            border: 2px solid var(--border-color);
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .alert-content.alert-low {
            border-color: var(--accent-green);
        }
        
        .alert-content.alert-medium {
            border-color: var(--accent-yellow);
        }
        
        .alert-content.alert-high {
            border-color: var(--accent-red);
            animation: slideUp 0.4s, shake 0.5s 0.4s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        
        .alert-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        
        .alert-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .alert-message {
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .alert-close-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .alert-close-btn:hover {
            transform: scale(1.05);
        }
        
        /* 监护人通知 */
        .guardian-notification {
            background: linear-gradient(135deg, #2a1f3d, #1a1f2e);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #4a3f5c;
        }
        
        .notification-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .notification-icon {
            width: 50px;
            height: 50px;
            background: var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .notification-info h4 {
            font-size: 1rem;
            margin-bottom: 3px;
        }
        
        .notification-info p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        .notification-content {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .notification-content p {
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        .notification-actions {
            display: flex;
            gap: 10px;
        }
        
        .notification-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .notification-btn.call {
            background: var(--accent-green);
            color: white;
        }
        
        .notification-btn.report {
            background: var(--accent-blue);
            color: white;
        }
        
        /* 安全报告 */
        .security-report {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .report-header {
            background: linear-gradient(135deg, #1a365d, #2a4a7f);
            padding: 20px;
            text-align: center;
        }
        
        .report-header h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .report-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
        }
        
        .report-body {
            padding: 20px;
        }
        
        .report-section {
            margin-bottom: 20px;
        }
        
        .report-section h4 {
            font-size: 0.9rem;
            color: var(--accent-blue);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .report-section ul {
            list-style: none;
            padding-left: 0;
        }
        
        .report-section li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .report-section li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent-blue);
        }
        
        .report-footer {
            background: var(--bg-secondary);
            padding: 15px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        /* 处理动画 */
        .processing {
            text-align: center;
            padding: 40px;
        }
        
        .processing-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .processing-text {
            color: var(--text-secondary);
        }
        
        /* 标签 */
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            margin-right: 5px;
        }
        
        .tag-fraud {
            background: rgba(244, 33, 46, 0.2);
            color: var(--accent-red);
        }
        
        .tag-keyword {
            background: rgba(29, 155, 240, 0.2);
            color: var(--accent-blue);
        }
        
        /* 时间线 */
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        
        .timeline::before {
            content: "";
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
        }
        
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }
        
        .timeline-item::before {
            content: "";
            position: absolute;
            left: -24px;
            top: 5px;
            width: 10px;
            height: 10px;
            background: var(--accent-blue);
            border-radius: 50%;
        }
        
        .timeline-item.completed::before {
            background: var(--accent-green);
        }
        
        .timeline-item h5 {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .timeline-item p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>AI反诈骗大师 - 全流程闭环演示</h1>
            <p>基于真实知识库的智能反诈系统，实现从输入识别到安全报告的完整闭环</p>
            <div class="flow-steps" id="flowSteps">
                <span class="flow-step" data-step="1">① 多模态输入</span>
                <span class="flow-step" data-step="2">② 文本预处理</span>
                <span class="flow-step" data-step="3">③ 向量检索</span>
                <span class="flow-step" data-step="4">④ 案例匹配</span>
                <span class="flow-step" data-step="5">⑤ 意图识别</span>
                <span class="flow-step" data-step="6">⑥ 风险判定</span>
                <span class="flow-step" data-step="7">⑦ 分级预警</span>
                <span class="flow-step" data-step="8">⑧ 监护人通知</span>
                <span class="flow-step" data-step="9">⑨ 安全报告</span>
            </div>
        </div>
        
        <div class="main-grid">
            <!-- 左侧：输入和检索 -->
            <div>
                <!-- 输入区域 -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <span class="step-badge">步骤1</span>
                        <h3>骗子诱导文本输入</h3>
                    </div>
                    <div class="card-body input-section">
                        <textarea id="inputText" placeholder="请输入需要分析的文本内容，例如可疑短信、聊天记录、电话录音转文字等..."></textarea>
                        <div class="sample-texts">
                            <span style="color: var(--text-secondary); font-size: 0.85rem; margin-right: 10px;">示例文本：</span>
                            <button class="sample-btn" onclick="loadSample('gongjianfa')">冒充公检法</button>
                            <button class="sample-btn" onclick="loadSample('shuadan')">刷单诈骗</button>
                            <button class="sample-btn" onclick="loadSample('daikuan')">网贷诈骗</button>
                            <button class="sample-btn" onclick="loadSample('youxi')">游戏诈骗</button>
                            <button class="sample-btn" onclick="loadSample('baojian')">保健品诈骗</button>
                            <button class="sample-btn" onclick="loadSample('normal')">正常对话</button>
                        </div>
                        <button class="analyze-btn" id="analyzeBtn" onclick="startAnalysis()">
                            🚀 开始全流程分析
                        </button>
                    </div>
                </div>
                
                <!-- 检索结果 -->
                <div class="card result-section" id="searchResultCard">
                    <div class="card-header">
                        <span class="step-badge">步骤2-4</span>
                        <h3>知识库检索结果</h3>
                    </div>
                    <div class="card-body">
                        <div id="searchResults"></div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧：识别结果和报告 -->
            <div>
                <!-- 意图识别结果 -->
                <div class="card result-section" id="intentCard" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <span class="step-badge">步骤5-6</span>
                        <h3>意图识别与风险判定</h3>
                    </div>
                    <div class="card-body">
                        <div id="intentResult"></div>
                    </div>
                </div>
                
                <!-- 监护人通知 -->
                <div class="card result-section" id="guardianCard" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <span class="step-badge">步骤8</span>
                        <h3>监护人通知模拟</h3>
                    </div>
                    <div class="card-body">
                        <div id="guardianNotification"></div>
                    </div>
                </div>
                
                <!-- 安全报告 -->
                <div class="card result-section" id="reportCard">
                    <div class="card-header">
                        <span class="step-badge">步骤9</span>
                        <h3>安全报告生成</h3>
                    </div>
                    <div class="card-body">
                        <div id="securityReport"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 预警弹窗 -->
    <div class="alert-modal" id="alertModal">
        <div class="alert-content" id="alertContent">
            <div class="alert-icon" id="alertIcon"></div>
            <div class="alert-title" id="alertTitle"></div>
            <div class="alert-message" id="alertMessage"></div>
            <button class="alert-close-btn" onclick="closeAlert()">我已了解</button>
        </div>
    </div>

    <script>
        // ==================== 真实知识库数据 ====================
        const knowledgeBase = [
            // 老年篇
            {
                id: "LN-001",
                type: "冒充公检法诈骗",
                group: "老年",
                keywords: ["公检法", "警察", "检察官", "涉嫌违法", "保证金", "罚款", "安全账户", "洗钱", "冻结"],
                description: "骗子伪装成警察、检察官、法官，以\"子女涉嫌违法\"为由，诱导交\"罚款\"\"保证金\"。公检法机关不会通过电话办案、索要钱款。",
                riskLevel: "high",
                case: "某67岁老人接到\"警察\"电话，称其儿子涉嫌洗钱，需交5万元\"保证金\"才能放人，老人转账后，联系儿子确认安全，才知道被骗。",
                law: "冒充公检法工作人员实施诈骗，属于诈骗罪的加重情节",
                defense: "公检法机关不会通过电话办案、索要钱款；遇到此类电话，立即挂断并拨打110报警。"
            },
            {
                id: "LN-002",
                type: "保健品诈骗",
                group: "老年",
                keywords: ["保健品", "能治百病", "治糖尿病", "治高血压", "治癌症", "特效药", "神药"],
                description: "骗子夸大保健品功效，谎称能治疗高血压、糖尿病、癌症等疾病，诱导老人高价购买劣质保健品。",
                riskLevel: "medium",
                case: "某70岁老人听信推销员\"保健品能治糖尿病\"的谎言，花费5万元购买保健品，服用后病情加重。",
                law: "《食品安全法》规定，食品、保健品不得声称具有治疗功效",
                defense: "凡是声称\"能治百病\"的保健品、药品，均为诈骗；看病买药要去正规医院、药店。"
            },
            {
                id: "LN-003",
                type: "养老金诈骗",
                group: "老年",
                keywords: ["养老金", "社保", "未到账", "点击链接", "核实", "身份证号", "银行卡号"],
                description: "骗子发送钓鱼链接，诱导老人填写身份证号、银行卡号、支付密码等信息，进而盗取养老金账户资金。",
                riskLevel: "high",
                case: "某68岁老人收到\"养老金未到账\"短信，点击链接后填写了银行卡信息和密码，导致养老金账户被盗刷2万元。",
                law: "盗取老年人养老金，构成盗窃罪，同时属于诈骗罪的加重情节",
                defense: "养老金问题仅通过官方渠道办理，陌生链接、陌生电话索要信息的，均为诈骗。"
            },
            {
                id: "LN-004",

                fraudType,
                confidence: Math.min(0.99, confidence).toFixed(2),
                matchedKeywords: keywords.map(k => k.word)
            };
        }
        
        // 生成预警弹窗内容
        function generateAlert(riskLevel, fraudType) {
            const alerts = {
                low: {
                    icon: "✅",
                    title: "低风险提示",
                    message: "经分析，当前内容未发现明显诈骗风险。但仍请保持警惕，不轻信陌生人的转账要求，不点击不明链接。",
                    class: "alert-low"
                },
                medium: {
                    icon: "⚠️",
                    title: "中等风险预警",
                    message: `检测到可疑内容，疑似涉及【${fraudType}】。请提高警惕！切勿向陌生人转账、点击不明链接或提供个人信息。建议与家人核实情况。`,
                    class: "alert-medium"
                },
                high: {
                    icon: "🚨",
                    title: "高风险紧急预警",
                    message: `警告！检测到高风险诈骗内容，疑似【${fraudType}】！请立即停止操作，不要转账、不要提供任何信息！请立即联系家人或拨打110报警！`,
                    class: "alert-high"
                }
            };
            return alerts[riskLevel];
        }
        
        // 生成监护人通知内容
        function generateGuardianNotification(result, text) {
            const time = new Date().toLocaleString('zh-CN');
            const riskText = {
                low: "低风险",
                medium: "中等风险",
                high: "高风险"
            };
            
            return `
                <div class="guardian-notification">
                    <div class="notification-header">
                        <div class="notification-icon">📱</div>
                        <div class="notification-info">
                            <h4>监护人安全提醒</h4>
                            <p>${time}</p>
                        </div>
                    </div>
                    <div class="notification-content">
                        <p><strong>风险等级：</strong><span class="risk-badge risk-${result.riskLevel}">${riskText[result.riskLevel]}</span></p>
                        <p><strong>诈骗类型：</strong>${result.fraudType}</p>
                        <p><strong>置信度：</strong>${(result.confidence * 100).toFixed(0)}%</p>
                        <p><strong>敏感内容：</strong></p>
                        <p style="background: var(--bg-secondary); padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 5px;">${text.substring(0, 100)}${text.length > 100 ? '...' : ''}</p>
                    </div>
                    <div class="notification-actions">
                        <button class="notification-btn call" onclick="alert('模拟拨打监护人电话...')">📞 联系当事人</button>
                        <button class="notification-btn report" onclick="alert('模拟报警...')">🚔 一键报警</button>
                    </div>
                </div>
            `;
        }
        
        // 生成安全报告
        function generateSecurityReport(result, searchResults, text) {
            const time = new Date().toLocaleString('zh-CN');
            const topCase = searchResults[0];
            
            let report = `
                <div class="security-report">
                    <div class="report-header">
                        <h3>🛡️ AI反诈骗安全报告</h3>
                        <p>生成时间：${time}</p>
                    </div>
                    <div class="report-body">
                        <div class="report-section">
                            <h4>📊 风险评估</h4>
                            <ul>
                                <li><strong>风险等级：</strong>${result.riskLevel === 'high' ? '高风险' : result.riskLevel === 'medium' ? '中风险' : '低风险'}</li>
                                <li><strong>诈骗类型：</strong>${result.fraudType}</li>
                                <li><strong>识别置信度：</strong>${(result.confidence * 100).toFixed(0)}%</li>
                                <li><strong>触发关键词：</strong>${result.matchedKeywords.join('、') || '无'}</li>
                            </ul>
                        </div>
            `;
            
            if (topCase) {
                report += `
                        <div class="report-section">
                            <h4>📚 知识库匹配案例</h4>
                            <ul>
                                <li><strong>案例编号：</strong>${topCase.id}</li>
                                <li><strong>案例类型：</strong>${topCase.type}</li>
                                <li><strong>相似度：</strong>${(topCase.similarity * 100).toFixed(0)}%</li>
                                <li><strong>真实案例：</strong>${topCase.case}</li>
                            </ul>
                        </div>
                        <div class="report-section">
                            <h4>⚖️ 法律法规依据</h4>
                            <ul>
                                <li>${topCase.law}</li>
                            </ul>
                        </div>
                `;
            }
            
            report += `
                        <div class="report-section">
                            <h4>🛡️ 防御指南</h4>
                            <ul>
                `;
            
            if (topCase) {
                report += `<li>${topCase.defense}</li>`;
            }
            
            // 通用防御建议
            const generalDefense = [
                "不轻信陌生人的电话、短信和网络消息",
                "不点击不明链接，不扫描陌生二维码",
                "不向陌生人转账、汇款",
                "不泄露身份证号、银行卡号、验证码等个人信息",
                "遇到可疑情况，及时与家人沟通或报警"
            ];
            
            generalDefense.forEach(d => {
                report += `<li>${d}</li>`;
            });
            
            report += `
                            </ul>
                        </div>
                        <div class="report-section">
                            <h4>🔧 处理建议</h4>
                            <ul>
                `;
            
            if (result.riskLevel === 'high') {
                report += `
                                <li>🔴 立即停止任何转账操作</li>
                                <li>🔴 拨打110报警或前往最近派出所</li>
                                <li>🔴 联系银行冻结相关账户</li>
                                <li>🔴 保存聊天记录、转账记录等证据</li>
                `;
            } else if (result.riskLevel === 'medium') {
                report += `
                                <li>🟡 暂停操作，与家人核实情况</li>
                                <li>🟡 通过官方渠道验证信息真伪</li>
                                <li>🟡 不进行任何转账或信息提供</li>
                                <li>🟡 必要时拨打110咨询</li>
                `;
            } else {
                report += `
                                <li>🟢 保持正常警惕即可</li>
                                <li>🟢 继续关注反诈知识学习</li>
                                <li>🟢 遇到可疑情况及时求助</li>
                `;
            }
            
            report += `
                            </ul>
                        </div>
                    </div>
                    <div class="report-footer">
                        本报告由AI反诈骗大师自动生成，仅供参考。如遇诈骗，请立即报警。
                    </div>
                </div>
            `;
            
            return report;
        }
        
        // 开始分析
        async function startAnalysis() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                alert('请输入需要分析的文本内容');
                return;
            }
            
            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 分析中...';
            
            // 显示结果区域
            document.querySelectorAll('.result-section').forEach(el => {
                el.classList.add('visible');
            });
            
            // 步骤1: 文本预处理
            updateFlowStep(1, 'active');
            await delay(300);
            updateFlowStep(2, 'active');
            
            const keywords = preprocessText(text);
            
            // 显示处理动画
            document.getElementById('searchResults').innerHTML = `
                <div class="processing">
                    <div class="processing-spinner"></div>
                    <p class="processing-text">正在进行向量检索...</p>
                </div>
            `;
            document.getElementById('intentResult').innerHTML = `
                <div class="processing">
                    <div class="processing-spinner"></div>
                    <p class="processing-text">正在识别意图...</p>
                </div>
            `;
            
            await delay(500);
            
            // 步骤2-4: 向量检索
            updateFlowStep(3, 'active');
            const searchResults = vectorSearch(text, keywords);
            
            await delay(300);
            updateFlowStep(4, 'active');
            
            // 显示检索结果
            let searchResultsHtml = '';
            if (searchResults.length > 0) {
                searchResults.forEach((result, index) => {
                    searchResultsHtml += `
                        <div class="search-result">
                            <span class="similarity">相似度: ${(result.similarity * 100).toFixed(0)}%</span>
                            <div class="case-id">案例编号: ${result.id} | 人群: ${result.group}</div>
                            <div class="case-type">诈骗类型: ${result.type}</div>
                            <div class="case-desc">${result.description}</div>
                            <div style="margin-top: 8px;">
                                ${result.matchedKeywords.map(kw => `<span class="tag tag-keyword">${kw}</span>`).join('')}
                            </div>
                        </div>
                    `;
                });
            } else {
                searchResultsHtml = `
                    <div class="result-item">
                        <h4>检索结果</h4>
                        <div class="content">知识库中未匹配到相似案例</div>
                    </div>
                `;
            }
            document.getElementById('searchResults').innerHTML = searchResultsHtml;
            
            await delay(500);
            
            // 步骤5-6: 意图识别和风险判定
            updateFlowStep(5, 'active');
            const intentResult = analyzeIntent(text, keywords, searchResults);
            
            await delay(300);
            updateFlowStep(6, 'active');
            
            // 显示意图识别结果
            const riskColors = {
                low: 'var(--accent-green)',
                medium: 'var(--accent-yellow)',
                high: 'var(--accent-red)'
            };
            const riskTexts = {
                low: '低风险',
                medium: '中等风险',
                high: '高风险'
            };
            
            document.getElementById('intentResult').innerHTML = `
                <div class="result-item">
                    <h4>意图识别结果</h4>
                    <div class="content">
                        <p><strong>识别类型：</strong>${intentResult.fraudType}</p>
                        <p style="margin-top: 10px;"><strong>风险等级：</strong></p>
                        <span class="risk-badge risk-${intentResult.riskLevel}">${riskTexts[intentResult.riskLevel]}</span>
                        <p style="margin-top: 10px;"><strong>置信度：</strong>${(intentResult.confidence * 100).toFixed(0)}%</p>
                        <p style="margin-top: 10px;"><strong>触发关键词：</strong></p>
                        <div style="margin-top: 5px;">
                            ${intentResult.matchedKeywords.map(kw => `<span class="tag tag-fraud">${kw}</span>`).join('') || '<span style="color: var(--text-secondary);">无敏感关键词</span>'}
                        </div>
                    </div>
                </div>
            `;
            
            await delay(500);
            
            // 步骤7: 显示预警弹窗
            updateFlowStep(7, 'active');
            const alertData = generateAlert(intentResult.riskLevel, intentResult.fraudType);
            
            const alertContent = document.getElementById('alertContent');
            alertContent.className = `alert-content ${alertData.class}`;
            document.getElementById('alertIcon').textContent = alertData.icon;
            document.getElementById('alertTitle').textContent = alertData.title;
            document.getElementById('alertMessage').textContent = alertData.message;
            document.getElementById('alertModal').classList.add('visible');
            
            // 等待用户关闭弹窗
            await new Promise(resolve => {
                window.closeAlertCallback = resolve;
            });
            
            await delay(300);
            
            // 步骤8: 监护人通知
            updateFlowStep(8, 'active');
            document.getElementById('guardianNotification').innerHTML = generateGuardianNotification(intentResult, text);
            
            await delay(500);
            
            // 步骤9: 生成安全报告
            updateFlowStep(9, 'active');
            document.getElementById('securityReport').innerHTML = generateSecurityReport(intentResult, searchResults, text);
            
            // 完成
            btn.disabled = false;
            btn.textContent = '🚀 开始全流程分析';
            
            // 保存分析结果
            analysisResult = {
                text,
                keywords,
                searchResults,
                intentResult,
                timestamp: new Date().toISOString()
            };
        }
        
        function closeAlert() {
            document.getElementById('alertModal').classList.remove('visible');
            if (window.closeAlertCallback) {
                window.closeAlertCallback();
                window.closeAlertCallback = null;
            }
        }
        
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
