<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反诈卫士</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- 头部 -->
    <header class="header">
      <div class="header-left">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L20 7.5V12.5C20 17.3 16.5 21.7 12 23C7.5 21.7 4 17.3 4 12.5V7.5L12 3Z" fill="#409EFF" stroke="#2c7be5" stroke-width="1.5"/>
          <path d="M12 8V13" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="1" fill="white"/>
        </svg>
        <h1 class="header-title">反诈卫士</h1>
      </div>
      <div class="header-right">
        <span class="header-badge">v1.0.0</span>
      </div>
    </header>

    <!-- 当前页面信息 -->
    <div class="page-info" id="pageInfo">
      <div class="page-info-row">
        <span class="page-info-label">当前页面</span>
        <span class="page-info-text" id="pageTitle">加载中...</span>
      </div>
      <div class="page-info-row">
        <span class="page-info-label">URL</span>
        <span class="page-info-text page-info-url" id="pageUrl">加载中...</span>
      </div>
    </div>

    <!-- 文本输入区域 -->
    <div class="input-section">
      <label class="input-label" for="detectText">
        输入待检测文本
        <span class="input-count" id="charCount">0 / 5000</span>
      </label>
      <textarea
        id="detectText"
        class="input-textarea"
        placeholder="请输入或粘贴需要检测的文本内容，如聊天记录、短信、网页内容等..."
        maxlength="5000"
        rows="5"
      ></textarea>
      <button class="detect-btn" id="detectBtn">
        <svg class="detect-btn-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 3V13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        开始检测
      </button>
    </div>

    <!-- 加载状态 -->
    <div class="loading-section" id="loadingSection" style="display:none;">
      <div class="loading-spinner"></div>
      <span class="loading-text">正在分析检测内容...</span>
    </div>

    <!-- 检测结果区域 -->
    <div class="result-section" id="resultSection" style="display:none;">
      <div class="result-header">
        <h3 class="result-title">检测结果</h3>
        <span class="result-time" id="resultTime">刚刚</span>
      </div>

      <div class="result-risk" id="resultRisk">
        <span class="result-risk-badge" id="riskBadge">低风险</span>
        <span class="result-risk-desc" id="riskDesc">此内容看起来安全</span>
      </div>

      <div class="result-details">
        <div class="result-detail-item">
          <span class="result-detail-label">诈骗类型</span>
          <span class="result-detail-value" id="fraudType">未识别</span>
        </div>
        <div class="result-detail-item">
          <span class="result-detail-label">置信度</span>
          <span class="result-detail-value" id="confidence">-</span>
        </div>
        <div class="result-detail-item result-detail-full">
          <span class="result-detail-label">AI 建议</span>
          <p class="result-detail-suggestion" id="suggestion">
            请保持警惕，不要轻易向陌生人转账或提供个人信息。
          </p>
        </div>
      </div>
    </div>

    <!-- 错误提示 -->
    <div class="error-section" id="errorSection" style="display:none;">
      <div class="error-icon">⚠️</div>
      <div class="error-text" id="errorText">检测失败</div>
      <button class="error-retry-btn" id="retryBtn">重试</button>
    </div>

    <!-- 底部导航 -->
    <footer class="footer">
      <button class="footer-btn" id="historyBtn">
        <svg class="footer-btn-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 4.5V8L10.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        检测历史
      </button>
      <button class="footer-btn" id="settingsBtn">
        <svg class="footer-btn-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 1V3M8 13V15M1 8H3M13 8H15M3.05 3.05L4.46 4.46M11.54 11.54L12.95 12.95M12.95 3.05L11.54 4.46M4.46 11.54L3.05 12.95" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        设置
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
